<meta charset="utf-8">
<style>
    *{padding:0;margin:0}
    div{
        overflow-y: scroll;
        width: 300px;
        height: 400px;
        background: black;
        color: white;
    }
    p.left{
        height: 50px;
        text-align: left;
    }
    p.right{
        height: 50px;
        text-align: right;
    }
    textarea{
        border-radius: 10px;
    }
</style>
<div>
    <p class="left">这</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">个</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">不</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">好</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">玩</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">去</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">看</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">其</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">他</p>
    <p class="right">王思聪吃🌭</p>
    <p class="left">的</p>
    <p class="right">王思聪吃🌭</p>
</div>
<textarea name="" id="" cols="30" rows="10" placeholder="&ensp;&ensp;&ensp;输入内容后enter+ctrl发送&#10;"></textarea>

<script>
    //给网页绑定键盘按下事件
    document.onkeyup = function(evt){
        // 获取事件对象
        var e = evt || window.event
        //获取按下的键
        var keycode = e.keyCode || e.which
        console.log(e);
        if(keycode === 13 && e.ctrlKey){
            // 获取textarea
            var textarea = document.querySelector('textarea')
            // 造一个p
            var pObj = document.createElement('p')
            pObj.className = 'right'
            pObj.innerText = textarea.value
            document.querySelector('div').appendChild(pObj)

            //滑动到底部
            document.querySelector('div').scrollTop = Math.abs(document.querySelectorAll('p').length*50-400)
        }
    }
</script>
