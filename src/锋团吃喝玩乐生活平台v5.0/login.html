      <a href="./index.html">

    <!-- section -->
    <section>
      <img
        class="animate__animated animate__fadeInLeft"
        src="./assets/imgs/nainai.jpeg"
        width="480"
        height="370"
        alt="锋团网"

      <!-- 登录表单 -->
      <style>
        .geetest_captcha .geetest_holder,
        .geetest_popup_wrap .geetest_holder {
          width: 280px;
        }

        #captchaBigData {
          margin-bottom: 20px;
          margin-left: 90px;
        }

        .geetest_captcha
          .geetest_holder
          .geetest_content
          .geetest_tip_container
          .geetest_logo,
        .geetest_popup_wrap
          .geetest_holder
          .geetest_content
          .geetest_tip_container

      </style>
      <form action="java.html" class="animate__animated animate__fadeInRight">
        <!-- 账号登录 -->
        <div class="account-login" style="position: relative">
          <p><span class="active">账号登录</span></p>
          <input
            type="text"
            class="account uname"
            placeholder="请输入用户名或手机号"
          />
          <input type="password" class="pwd" placeholder="请输入密码" />
          <i
            class="iconfont icon-jurassic_loseeyes showPassword"
            style="position: absolute; right: 105px; top: 112px"
          ></i>

          <!-- 行为验证码 -->
          <div id="captcha0"></div>
          <!-- 行为验证码 -->

          <p>
            <input type="checkbox" class="remember" id="remember" />
            <label for="sms-remember">勾选七天免登录</label>
          </p>
          <button class="wof-button wof-button--yellow account denglu">
            账号登录
          </button>
          <button class="wof-button wof-button--info duanxin">短信登录</button>
          <button class="wof-button wof-button--info">扫码登录</button>
        </div>
        <!-- 账号登录 -->

        <!-- 短信登录 -->
        <div class="sms-login">
          <p><span class="active">短信登录</span></p>
          <input type="text" class="mobile" placeholder="请输入手机号" />
          <input type="text" maxlength="6" class="code" placeholder="动态码" />
          <a href="javascript:;">获取手机动态码</a>

          <!-- 行为验证码 -->
          <div id="captcha1"></div>
          <!-- 行为验证码 -->

          <p>
            <input type="checkbox" class="remember" id="sms-remember" />
            <label for="sms-remember">勾选七天免登录</label>
          </p>
          <button class="wof-button wof-button--yellow sms">短信登录</button>
          <button class="wof-button wof-button--info">账号登录</button>
          <button class="wof-button wof-button--info">扫码登录</button>
        </div>
        <!-- 短信登录 -->

        <!-- 短信登录 -->
        <div class="saoma-login">
          <p><span class="active">扫码登录</span></p>
          <!-- <img src="./assets/imgs/ewm.png" alt="二维码" width="270"> -->
          <div id="saomaImg" style="width: 270px"></div>
          <button class="wof-button wof-button--yellow saoma">
            刷新二维码
          </button>
          <button class="wof-button wof-button--info">短信登录</button>
          <button class="wof-button wof-button--info">账号登录</button>
        </div>
        <!-- 短信登录 -->
        <p>
          还没有账号？
          <a href="./registry.html">免费注册</a>
        </p>
