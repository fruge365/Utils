<script>
  console.log('用户名：amoureux555');
  console.log('密码：admin888');
  $('#denglu').click(function (e) {
    e.preventDefault()

    // let account = document.querySelector('.uname')
    // let pwd = document.querySelector('.pwd')
    // 实现登录
    $.post(
      'http://kg.zhaodashen.cn/mt/web/user/login.jsp',
      {
        account: $('.uname').val(),
        pwd: $('.pwd').val(),
      },
      res => {
        if (res.meta.state === 200) {
          console.log('登录成功', res);
          console.log($('#sms-remember:checked'));
          // if($('#sms-remember:checked')){
          if($('#sms-remember').prop('checked')){
            console.log('勾选了七天免登录');
            localStorage.setItem('uname',res.data.uname)
            localStorage.setItem('avatar',res.data.avatar)
            localStorage.setItem('token',res.data.token)
            localStorage.setItem('expires',(new Date).getTime()+20*1000)
          }else{
            console.log('没勾选了七天免登录');
            sessionStorage.setItem('uname',res.data.uname)
            sessionStorage.setItem('avatar',res.data.avatar)
            sessionStorage.setItem('token',res.data.token)
          }
          location.href = './index.html'
        } else {
          console.log('登录失败', res);
        }
      },
      'json',
    )
  })
</script>
