<button id="a">按钮1</button>


<div id="captcha2">

    </div> -->
    <div id="wait2" class="show">
        <div class="loading">

<!-- 注意，验证码本身是不需要 jquery 库，此处使用 jquery 仅为了在 demo 中使用，减少代码量 -->
<script src="../../assets/js/jquery-1.8.3.min.js"></script>
<!-- 引入 gt.js，既可以使用其中提供的 initGeetest 初始化函数。为防劫持，强烈建议将此文件放在客户服务器！！！-->
<script src="./gt.js"></script>

<script src="./captcha.js"></script>
<script>
    console.log(captchaFn)
    captchaFn('#captcha', '#wait', captchaObj=> {

        $('#a').click(function() {

            var result = captchaObj.getValidate();
            if (!result) {
                return alert('请完成验证');
            }
            
            alert('第一个行为验证通过发送异步请求中...')
        })
    })


    captchaFn('#captcha2', '#wait2', captchaObj=> {

        $('#a2').click(function() {

            var result = captchaObj.getValidate();
            if (!result) {
                return alert('请完成验证222');
            }
            
            alert('第一个行为验证通过发送异步请求中222...')
        })
    })  

</script>
