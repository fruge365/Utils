<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>注册 | 美团网</title>
  <link rel="icon" href="assets/imgs/favicon.ico" sizes="16x16 32x32">
  <link rel="stylesheet" href="./assets/css/normalize.css">
  <link rel="stylesheet" href="./assets/lib/animate.css">
  <link rel="stylesheet" href="./assets/css/registry.css">
</head> 
<body class="animate__animated animate__bounceInDown">
  <!-- header -->
  <header>
    <div class="wrapper">
      <a href="./index.html" ><img class="logo" src="./assets/imgs/logo.png" alt="logo"></a>
      <div class="login">
        <span >已有美团账号？</span>
        <a href="./login.html" class="wof-button wof-button--yellow">登录</a>
      </div>
    </div>
  </header>
  <!-- header -->
    
  <!-- section -->
  <section>
      <form class="reg" action="java.html" >
        <p>
          <span>用户名</span>
          <input type="text" class="account" placeholder="请输入用户名">
        </p>
        <p>
          <span>密码</span>
          <input type="password" class="pwd" placeholder="请输入密码">
        </p>
        <p>
          <span>确认密码</span>
          <input type="password" class="pwd2" placeholder="请输入确认密码">
        </p>
        <p class="captcha">
          <span>验证码</span>
          <input type="text" placeholder="请输入验证码">
          <img src="http://kg.zhaodashen.cn/v1/public/captcha2.jsp" width="100" height="39" alt="captcha">
        </p>
        <button class="wof-button wof-button--yellow">注册</button>
        <p class="mobileBtn">📱 手机注册</p>
      </form>
      
      <form class="smsReg" action="java.html" >
        <p>
          <span>手机号</span>
          <input type="text" class="mobile" placeholder="请输入手机号">
        </p>
        <p >
          <span>验证码</span>
          <input type="password" maxlength="6" class="code" placeholder="请输入手机验证码">
          <a href="javascript:;">获取手机动态码</a>
        </p>
        <button class="wof-button wof-button--yellow">手机注册</button>
        <p class="mobileBtn">普通注册</p>
      </form>
  </section>
  <!-- section -->

  <!-- footer -->
  <footer>
      <p class="copyright">
          ©<a class="f1" href="https://www.meituan.com">meituan.com</a>&nbsp;
          <a class="f1" target="_blank" href="http://www.miibeian.gov.cn/">京ICP证070791号</a>&nbsp;
          <span class="f1">京公网安备11010502025545号</span>
      </p>
  </footer>
  <!-- footer -->
  <script src="./assets/js/jquery-1.8.3.min.js"></script>
  <script src="./assets/js/registry.js"></script>
</body>
</html>
