<meta charset="utf-8">
<style>
    div{
        height: 40px;
        font-size: 30px;
        font-weight: bold;
        font-family: '楷体';
    }
</style>
<div>F12 控制台查看效果</div>

<script>
    console.log('<--底层forEach-->');
    //底层forEach
    let arr = ['亚索', '锐雯', '男枪', '提莫', '女枪']
    arr.forEach((item, i) => {
        console.log(item, i);
    })



    console.log('<--仿写forEach-->');
    //仿写forEach
    Array.prototype.forEach2 = function (callback) {

        // let callback =(item, i) => {console.log(item, i);}
        for (i = 0; i < this.length; i++) {
            callback(this[i], i)
        }
    }
    let arr1 = ['亚索', '锐雯', '男枪', '提莫', '女枪']
    arr1.forEach2((item, i) => {
        console.log(item, i);
    })


</script>
